# A template: the nginx image fills in ${NGINX_LOCAL_RESOLVERS} from the
# container's /etc/resolv.conf when it starts (see the Dockerfile), and the
# BenchLM and TMDB keys from the container's environment (see .env.example).

# Answers from the keyed services are kept for half a week, so BenchLM and TMDB
# are asked at most twice a week however many people open the dashboard.
proxy_cache_path /var/cache/nginx/dashboard levels=1:2 keys_zone=dashboard:1m max_size=50m inactive=8d use_temp_path=off;

# The only settings the keyed relays pass on; anything else asks for the default,
# so a stranger can't spend the month's reads by varying the address.
map $arg_surface $benchlm_surface {
  default overall;
  coding coding;
  agentic agentic;
  knowledge knowledge;
}

map $arg_window $tmdb_window {
  default week;
  day day;
}

# The Google Calendar feed the page asks for, named by its path in the X-Calendar-Feed
# header (so the address, which is the key to the calendar, is never in a URL or a log).
# Only the path of a "secret address in iCal format" passes, and the host is fixed in
# the location below, so the page can't make this server fetch anything else. The same
# pattern is in src/dashboard/lib/calendar-address.ts.
map $http_x_calendar_feed $calendar_feed_path {
  default "";
  "~^(?<feed>/calendar/ical/[A-Za-z0-9%_.@-]{1,200}/(?:private-[A-Za-z0-9]{1,100}|public)/basic\.ics)$" $feed;
}

# BenchLM's price list comes in pages of 200 models; only these offsets pass.
map $arg_offset $benchlm_price_offset {
  default 0;
  200 200;
  400 400;
  600 600;
  800 800;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # Prices for the dashboard's markets widget. Yahoo Finance doesn't answer
  # browsers on other sites, so this server asks on the page's behalf. Only
  # the chart endpoint is reachable, only with GET, and no cookies go either way.
  location /api/markets/ {
    limit_except GET {
      deny all;
    }

    # Resolved per request, so the container starts even while DNS is not up yet.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $yahoo query1.finance.yahoo.com;
    rewrite ^/api/markets/(.*)$ /v8/finance/chart/$1 break;
    proxy_pass https://$yahoo;
    proxy_ssl_server_name on;
    # Yahoo turns away handshakes that look like a script's; a browser-like
    # cipher order gets through (the same list as vite.config.ts).
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA:AES256-SHA;
    proxy_ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    proxy_set_header Host $yahoo;
    proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=300";
  }

  # The AI Leaderboard widget's rankings. The key is added here and never
  # reaches the page; one answer per ranking is kept for 84 hours.
  location = /api/benchlm/rankings {
    limit_except GET {
      deny all;
    }

    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $benchlm data.benchlm.ai;
    rewrite ^ /v1/rankings/current?surface=$benchlm_surface&limit=50? break;
    proxy_pass https://$benchlm;
    proxy_ssl_server_name on;
    proxy_set_header Host $benchlm;
    proxy_set_header Authorization "Bearer ${BENCHLM_TOKEN}";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache dashboard;
    proxy_cache_key benchlm:$benchlm_surface;
    proxy_cache_valid 200 84h;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Cache-Status $upstream_cache_status;
  }

  # The AI Leaderboard's budget view: BenchLM's public price list, which needs
  # no key (CC BY-NC 4.0, so for personal use). Kept the same way, a page at a time.
  location = /api/benchlm/pricing {
    limit_except GET {
      deny all;
    }

    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $benchlm_site benchlm.ai;
    rewrite ^ /api/data/pricing?limit=200&offset=$benchlm_price_offset? break;
    proxy_pass https://$benchlm_site;
    proxy_ssl_server_name on;
    proxy_set_header Host $benchlm_site;
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache dashboard;
    proxy_cache_key benchlm-pricing:$benchlm_price_offset;
    proxy_cache_valid 200 84h;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Cache-Status $upstream_cache_status;
  }

  # The Popular TV widget's list, kept the same way.
  location = /api/tmdb/trending-tv {
    limit_except GET {
      deny all;
    }

    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $tmdb api.themoviedb.org;
    rewrite ^ /3/trending/tv/$tmdb_window?language=en-US? break;
    proxy_pass https://$tmdb;
    proxy_ssl_server_name on;
    proxy_set_header Host $tmdb;
    proxy_set_header Authorization "Bearer ${TMDB_TOKEN}";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache dashboard;
    proxy_cache_key tmdb:tv:$tmdb_window;
    proxy_cache_valid 200 84h;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Cache-Status $upstream_cache_status;
  }

  # The Agenda widget's calendars. A feed holds a calendar's whole history, so one
  # answer is kept for five minutes and shared by everyone who asks for the same feed.
  # What it carries is private: Cache-Control says so, and this dashboard should sit
  # behind your VPN or reverse proxy's login if it is reachable from outside. No
  # address answers 204, which the widget reads as "none yet"; an address that isn't
  # a Google Calendar feed is turned away with 400.
  location ~ ^/api/calendar/[123]$ {
    limit_except GET {
      deny all;
    }

    if ($http_x_calendar_feed = "") {
      return 204;
    }

    if ($calendar_feed_path = "") {
      return 400;
    }

    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $calendar_host calendar.google.com;
    proxy_pass https://$calendar_host$calendar_feed_path;
    proxy_ssl_server_name on;
    proxy_set_header Host $calendar_host;
    # The feed's path is the page's to name, not Google's to be told twice.
    proxy_set_header X-Calendar-Feed "";
    # Ask for the feed uncompressed, so the one cached copy suits every visitor;
    # nginx compresses it on the way out.
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache dashboard;
    proxy_cache_key calendar:$calendar_feed_path;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    gzip on;
    gzip_types text/calendar;
    gzip_proxied any;
    add_header Cache-Control "private, max-age=60";
    add_header Vary X-Calendar-Feed;
    add_header X-Content-Type-Options nosniff;
    add_header X-Cache-Status $upstream_cache_status;
  }
}
